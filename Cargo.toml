[package]
name = "meeseeks"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A virtual monitor shown as a window, for sharing a sane-sized screen"

[dependencies]
# async-io rather than the default tokio: the futures are driven by the GLib
# main loop, and zbus then runs the bus connection on a helper thread of its own.
# remote_desktop is for the teleporter: the session that comes with a pointer.
ashpd = { version = "0.14", default-features = false, features = ["async-io", "remote_desktop", "screencast"] }
env_logger = "0.11"
gst = { package = "gstreamer", version = "0.25" }
# gtk4paintablesink, linked into the binary so that no distribution package
# is needed for it: Ubuntu 24.04 has none. `dmabuf` is the zero-copy path,
# which needs GTK 4.14; `wayland` lets the sink share GTK's GL context there.
gst-plugin-gtk4 = { version = "0.15", features = ["gtk_v4_14", "dmabuf", "wayland"] }
# GtkGraphicsOffload, the widget that hands DMA-BUF frames to the compositor,
# arrived in GTK 4.14.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
log = "0.4"
# libei, which moves the pointer in src/pointer.rs, and the clock its events
# are stamped with.
reis = "0.7"
rustix = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
